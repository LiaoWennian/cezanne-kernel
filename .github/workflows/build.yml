name: Build cezanne kernel (EROFS for HyperOS 4)

on:
  workflow_dispatch:
    inputs:
      enable_erofs:
        description: "移植 EROFS 驱动（澎湃 OS4 系统层必需，勿关）"
        type: boolean
        default: true
      enable_ksu:
        description: "集成 KernelSU（首次验证开机建议 false）"
        type: boolean
        default: false
      localversion:
        description: "内核版本后缀。保持默认才能让原厂 vendor .ko 直接加载"
        required: false
        default: "-perf-00252-g2f26b5917fd6"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    env:
      ENABLE_EROFS: ${{ inputs.enable_erofs && '1' || '0' }}
      ENABLE_KSU: ${{ inputs.enable_ksu && '1' || '0' }}
      # 变量名不能叫 LOCALVERSION：内核 scripts/setlocalversion 会把
      # make 变量 LOCALVERSION 和 CONFIG_LOCALVERSION 各追加一次，
      # 用同名环境变量会让版本后缀重复两遍。
      KERNEL_LOCALVERSION: ${{ inputs.localversion }}

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 清理磁盘并增加 swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          sudo fallocate -l 4G /swapfile && sudo chmod 600 /swapfile
          sudo mkswap /swapfile && sudo swapon /swapfile
          df -h / && free -g

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio flex git kmod libelf-dev libssl-dev \
            lz4 lzop python3 rsync unzip xz-utils zip \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu
          # 交叉工具自检：缺任何一个都直接失败，不要留到编译阶段才发现
          aarch64-linux-gnu-as --version | head -n1
          aarch64-linux-gnu-ld --version | head -n1
          aarch64-linux-gnu-gcc --version | head -n1
          # clang-r383902 是 2020 年的 prebuilt，依赖 libtinfo5/libncurses5
          if ! sudo apt-get install -y --no-install-recommends libtinfo5 libncurses5; then
            echo "libtinfo5 不可用，改用 libtinfo6 + 兼容软链"
            sudo apt-get install -y --no-install-recommends libtinfo6 libncurses6 || true
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
          fi

      - name: 下载 clang-r383902（与官方 build.config.mtk.aarch64 一致）
        run: |
          set -euo pipefail
          mkdir -p toolchain/clang
          curl -fsSL --retry 5 --retry-delay 5 \
            -o /tmp/clang-r383902.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902.tar.gz"
          ls -lh /tmp/clang-r383902.tar.gz
          tar -xzf /tmp/clang-r383902.tar.gz -C toolchain/clang
          test -x toolchain/clang/bin/clang || { echo "clang 解包不完整"; exit 1; }
          test -x toolchain/clang/bin/ld.lld || { echo "ld.lld 缺失，LTO/CFI 会失败"; exit 1; }
          toolchain/clang/bin/clang --version | head -n1
          toolchain/clang/bin/ld.lld --version

      - name: 克隆小米官方内核源码（cezanne-r-oss, 4.14.186）
        run: |
          set -e
          git clone --depth=1 -b cezanne-r-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
          # 去掉 .git，避免 LOCALVERSION_AUTO 把 -g<sha> 拼进版本号
          rm -rf kernel/.git
          du -sh kernel

      - name: 修补厂端 Makefile（LTO 下的 duplicate symbol）
        run: sh scripts/patch_vendor.sh

      - name: 移植 EROFS 驱动
        if: env.ENABLE_EROFS == '1'
        run: sh scripts/fetch_erofs.sh

      - name: 克隆 KernelSU v0.9.5（最后支持非 GKI 的版本）
        if: env.ENABLE_KSU == '1'
        run: |
          set -e
          git clone --filter=blob:none https://github.com/tiann/KernelSU.git KernelSU
          git -C KernelSU checkout v0.9.5
          echo "commit count: $(git -C KernelSU rev-list --count HEAD)"

      - name: 预检 fs/erofs 编译（失败即止，省时间）
        if: env.ENABLE_EROFS == '1'
        run: PRECHECK=1 sh scripts/build.sh

      - name: 编译内核
        run: sh scripts/build.sh

      - name: 打包 AnyKernel3 卡刷包
        run: |
          set -e

          # AnyKernel3 从网络取，git 偶发失败时退回 codeload tarball
          for i in 1 2 3; do
            rm -rf ak3
            if git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3 2>/dev/null; then
              echo "git clone 成功（第 $i 次）"
              break
            fi
            echo "git clone 第 $i 次失败，改用 tarball"
            if curl -fsSL --retry 3 -o ak3.tar.gz \
                 "https://codeload.github.com/osm0sis/AnyKernel3/tar.gz/refs/heads/master"; then
              mkdir -p ak3 && tar -xzf ak3.tar.gz -C ak3 --strip-components=1 && break
            fi
            sleep 5
          done
          test -f ak3/tools/ak3-core.sh || { echo "AnyKernel3 获取失败"; exit 1; }
          rm -rf ak3/.git ak3.tar.gz

          B=out/arch/arm64/boot
          TAG="cezanne-erofs"
          if [ "$ENABLE_KSU" = "1" ]; then TAG="$TAG-ksu"; fi

          if [ -f "$B/Image.gz-dtb" ]; then
            rm -f ak3/Image ak3/zImage ak3/Image.gz ak3/Image.gz-dtb
            cp anykernel/anykernel.sh ak3/anykernel.sh
            cp "$B/Image.gz-dtb" ak3/Image.gz-dtb
            ( cd ak3 && zip -r9 "../$TAG-dtb-anykernel3.zip" . -x '*.git*' )
          fi

          rm -f ak3/Image ak3/zImage ak3/Image.gz ak3/Image.gz-dtb
          cp anykernel/anykernel.sh ak3/anykernel.sh
          cp "$B/Image.gz" ak3/Image.gz
          ( cd ak3 && zip -r9 "../$TAG-gz-anykernel3.zip" . -x '*.git*' )

          ls -lh ./*anykernel3.zip

      - name: 收集产物
        run: |
          set -e
          mkdir -p dist
          cp out/arch/arm64/boot/Image.gz dist/
          [ -f out/arch/arm64/boot/Image.gz-dtb ] && cp out/arch/arm64/boot/Image.gz-dtb dist/ || true
          [ -f out/arch/arm64/boot/Image ] && cp out/arch/arm64/boot/Image dist/ || true
          cp out/.config dist/config.txt
          cp out/System.map dist/System.map || true
          cp ./*anykernel3.zip dist/ || true
          cat out/include/config/kernel.release > dist/kernel-release.txt
          {
            echo "编译时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "内核 release: $(cat dist/kernel-release.txt)"
            echo "EROFS: $ENABLE_EROFS   KernelSU: $ENABLE_KSU"
            echo "EROFS 生效: $(grep -c '^CONFIG_EROFS_FS=y' dist/config.txt)"
            echo "MODVERSIONS: $(grep -c '^CONFIG_MODVERSIONS=y' dist/config.txt)"
            echo -n "module_layout CRC: "
            grep -m1 'module_layout' out/Module.symvers || echo "缺失（异常，模块会加载失败）"
            echo "导出符号总数: $(wc -l < out/Module.symvers)"
          } > dist/BUILD-INFO.txt
          ls -lh dist

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cezanne-kernel-erofs
          path: dist/
          if-no-files-found: error
          retention-days: 30
